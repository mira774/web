<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Быстрый Веном & Магия Жестов</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    #webcam {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; opacity: 0; pointer-events: none; z-index: 10;
      transition: opacity 0.1s ease-out;
    }
    .hint {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      z-index: 5; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 18px;
      border-radius: 15px; font-size: 12px; text-align: center; border: 1px solid #333;
    }
  </style>

  <!-- Подключение MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="flash"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hint">
    👌 <b>ОК:</b> Маска Венома на лицо | 🤌 <b>Щелчок:</b> Вспышка Таноса<br>
    ✌️ <b>Треугольник:</b> Черная кисть Венома
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const flashEl = document.getElementById('flash');

    let w = window.innerWidth, h = window.innerHeight;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let facePoints = null;
    let venomHandProgress = 0;
    let lastSnapState = false;

    // Отрезки суставов
    const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

    function triggerThanosSnap() {
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 500);
    }

    function onResults(results) {
      ctx.clearRect(0, 0, w, h);

      let isOKGesture = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          const pts = landmarks.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));

          // --- 1. ПРОВЕРКА ЖЕСТОВ ---
          const okDist = Math.hypot(pts[4].x - pts[8].x, pts[4].y - pts[8].y);
          isOKGesture = okDist < 35; // Жест ОК

          // Щелчок Таноса (Большой pt[4] + Средний pt[12])
          const snapDist = Math.hypot(pts[4].x - pts[12].x, pts[4].y - pts[12].y);
          if (snapDist < 25 && !lastSnapState) {
            triggerThanosSnap();
            lastSnapState = true;
          } else if (snapDist > 50) {
            lastSnapState = false;
          }

          // Треугольник / Виктори (Указательный pt[8] + Средний pt[12])
          const isTriangle = pts[8].y < pts[6].y && pts[12].y < pts[10].y && pts[16].y > pts[14].y;

          // --- 2. ЭФФЕКТ ВЕНОМ-КИСТИ ---
          if (isTriangle) {
            if (venomHandProgress < 1) venomHandProgress += 0.05;
          } else {
            if (venomHandProgress > 0) venomHandProgress -= 0.05;
          }

          // Отрисовка скелета руки
          ctx.strokeStyle = '#00ffcc';
          ctx.lineWidth = 3;
          for (const [i, j] of CONNECTIONS) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.stroke();
          }

          // Покрытие руки черной слизью Венома
          if (venomHandProgress > 0) {
            ctx.fillStyle = `rgba(5, 5, 5, ${venomHandProgress})`;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
              ctx.lineTo(pts[i].x + (Math.random() - 0.5) * 6, pts[i].y + (Math.random() - 0.5) * 6);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#a855f7';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Точки суставов
          for (let p of pts) {
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // --- 3. ЧЕРНАЯ МАСКА ВЕНОМА НА ЛИЦО (ПРИ ЖЕСТЕ ОК) ---
      if (isOKGesture && facePoints) {
        ctx.fillStyle = '#050505';
        ctx.beginPath();
        ctx.moveTo((1 - facePoints[10].x) * w, facePoints[10].y * h);
        
        // Внешний контур лица для полной заливки
        const faceOutlineIndices = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
        
        for (let idx of faceOutlineIndices) {
          const pt = facePoints[idx];
          ctx.lineTo((1 - pt.x) * w, pt.y * h);
        }
        ctx.closePath();
        ctx.fill();

        // Белые глаза Венома
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse((1 - facePoints[159].x) * w, facePoints[159].y * h, 18, 8, -0.3, 0, Math.PI * 2);
        ctx.ellipse((1 - facePoints[386].x) * w, facePoints[386].y * h, 18, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Инициализация легкого Hands
    const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6 });
    hands.onResults(onResults);

    // Оптимизированный Face Mesh (работает раз в пару кадров для скорости)
    const faceMesh = new FaceMesh({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5 });
    faceMesh.onResults(res => {
      facePoints = (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) ? res.multiFaceLandmarks[0] : null;
    });

    let frameCount = 0;
    const camera = new Camera(video, {
      onFrame: async () => {
        frameCount++;
        await hands.send({ image: video });
        if (frameCount % 3 === 0) { // Проверяем лицо каждый 3-й кадр для пропуска лагов
          await faceMesh.send({ image: video });
        }
      },
      facingMode: "user", width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
