<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Симбионт</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#cfe;font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3}
video,canvas{position:absolute;inset:0;width:100%;height:100%}
video{transform:scaleX(-1);filter:grayscale(1) brightness(.55)}
#ui{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:14px;text-shadow:0 0 6px #000}
#bar{width:220px;height:6px;margin:8px auto 0;background:#222;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#7af}
#go{position:fixed;inset:0;margin:auto;width:260px;height:56px;font-size:18px;border:0;border-radius:28px;background:#111;color:#fff;box-shadow:0 0 30px #5af;cursor:pointer}
</style></head><body>
<div id="stage"><video id="v" playsinline muted></video></div>
<button id="go">Включить камеру</button>
<div id="ui"><div id="msg">Руку выше головы — шипы · Ладони вместе — шар · Руки в стороны — крылья · Наклони голову и держи 3 с — всё стечёт</div><div id="bar"><i></i></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {PoseLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

const $=id=>document.getElementById(id), msg=$('msg'), bar=$('bar').firstChild, video=$('v');
const R=Math.random;
$('go').onclick=async()=>{ $('go').remove(); try{ await start(); }catch(e){ msg.textContent='Ошибка: '+e.message; } };

async function start(){
  msg.textContent='Запрашиваю камеру…';
  video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
  await video.play();
  const A=video.videoWidth/video.videoHeight;
  $('stage').style.aspectRatio=A;
  msg.textContent='Загружаю модель тела…';
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const pose=await PoseLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},
    runningMode:'VIDEO',numPoses:1});

  // ---------- 3D сцена ----------
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  $('stage').appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
  const cam=new THREE.OrthographicCamera(-A,A,1,-1,.1,10); cam.position.z=5;
  const dl=new THREE.DirectionalLight(0x9bf,2); dl.position.set(-2,3,4); scene.add(dl);
  const pl=new THREE.PointLight(0xffffff,3,10); pl.position.set(2,1,3); scene.add(pl);
  const resize=()=>{const r=$('stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false)};
  addEventListener('resize',resize); resize();

  // ---------- частицы-симбионт ----------
  const P=[];
  const add=o=>P.push({...o,pos:new THREE.Vector3(0,-5,0),vel:new THREE.Vector3(),k:.1+R()*.2,s:.75+R()*.5,ph:R()*6.28,
    sd:new THREE.Vector3(R()-.5,R()-.5,R()-.5).normalize(),slide:(R()-.5)*.5});
  // [a,b,кол-во,радиус,рука,предплечье]
  [[11,13,45,.15,'L',0],[13,15,50,.12,'L',1],[12,14,45,.15,'R',0],[14,16,50,.12,'R',1],
   [15,19,18,.1,'L',1],[16,20,18,.1,'R',1],
   [23,25,55,.2,'',0],[25,27,55,.15,'',0],[24,26,55,.2,'',0],[26,28,55,.15,'',0]]
  .forEach(([a,b,n,r,arm,fore])=>{for(let i=0;i<n;i++)add({type:'b',a,b,r,arm,fore,t:R(),ang:R()*6.28})});
  for(let i=0;i<190;i++)add({type:'q',u:R(),v:R(),wing:R()<.4,f:R(),g:R()});
  for(let i=0;i<120;i++)add({type:'h'});

  const mesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,14,14),
    new THREE.MeshPhysicalMaterial({color:0x07070b,metalness:1,roughness:.13,clearcoat:1,envMapIntensity:1.3}),P.length);
  mesh.frustumCulled=false; scene.add(mesh);

  // ---------- состояние ----------
  const L=Array.from({length:33},()=>new THREE.Vector3()), vis=new Array(33).fill(0);
  let have=false, melted=false, hold=0, base=null, back=0, lastT=-1;
  const V=(x,y,z)=>new THREE.Vector3(x,y,z), dummy=new THREE.Object3D();

  function target(p,time,m,sw,head){
    const t=new THREE.Vector3();
    if(m.melted) return t;
    if(p.type==='b'){
      const a=L[p.a],b=L[p.b],d=b.clone().sub(a);
      let tt=p.t,r=p.r*sw;
      if(m.orb&&p.arm){ // шар между ладонями
        const c=L[15].clone().add(L[16]).multiplyScalar(.5), q=p.sd.clone();
        const x=q.x*Math.cos(time*2)+q.z*Math.sin(time*2), z=-q.x*Math.sin(time*2)+q.z*Math.cos(time*2);
        return c.add(V(x,q.y,z).multiplyScalar(sw*.5*(1+.1*Math.sin(time*8+p.ph))));
      }
      if(m.up[p.arm]&&p.fore){tt=p.t*2.6;r*=(1-.85*p.t)*(1+.3*Math.sin(time*7+p.ph));} // шипы/клинок
      const pr=V(-d.y,d.x,0).normalize();
      return a.clone().add(d.multiplyScalar(tt)).add(pr.multiplyScalar(Math.cos(p.ang)*r)).add(V(0,0,Math.sin(p.ang)*r));
    }
    if(p.type==='q'){
      if(m.wings&&p.wing){ // крылья
        const s=p.u<.5?0:1, sh=L[s?12:11], w=L[s?16:15];
        return sh.clone().add(w.clone().sub(sh).multiplyScalar(.2+.8*p.f))
          .add(V(0,-p.g*sw*.9*(1-p.f),-.1*sw+Math.sin(time*5+p.ph)*.02));
      }
      const top=L[11].clone().lerp(L[12],p.u), bot=L[23].clone().lerp(L[24],p.u);
      return top.lerp(bot,p.v).add(V(0,0,sw*.12));
    }
    const out=head.c.clone().add(p.sd.clone().multiplyScalar(head.r*1.05));
    if(m.up.L&&m.up.R)out.add(p.sd.clone().multiplyScalar(head.r*.5*Math.max(0,Math.sin(time*6+p.ph*3)))); // корона
    return out;
  }

  function loop(now){
    requestAnimationFrame(loop);
    const time=now/1000, dt=Math.min(.05,(now-(loop.p||now))/1000); loop.p=now;
    if(video.currentTime!==lastT){
      lastT=video.currentTime;
      const res=pose.detectForVideo(video,now);
      if(res.landmarks[0]){
        have=true;
        res.landmarks[0].forEach((l,i)=>{
          const tp=V((.5-l.x)*2*A,(.5-l.y)*2,-l.z*A*1.2);
          L[i].lerp(tp,.55); vis[i]=l.visibility;
        });
      } else have=false;
    }
    if(!have){msg.textContent='Встань в кадр так, чтобы было видно тело';}
    const sw=Math.max(.15,L[11].distanceTo(L[12]));
    const earM=L[7].clone().add(L[8]).multiplyScalar(.5);
    const head={c:earM.clone().add(V(0,sw*.12,0)),r:Math.max(.08,L[7].distanceTo(L[8])*.85)};

    // жест головой: наклон + 3 секунды
    const d=(earM.y-L[0].y)/sw;
    if(base===null)base=d;
    const nod=d>base+.12;
    if(!nod&&!melted)base+=(d-base)*.03;
    if(nod&&!melted){hold+=dt; if(hold>=3){melted=true;hold=0;P.forEach(p=>{p.vel.set((R()-.5)*.5,R()*.2,0)})}}
    else if(!nod){hold=0; if(melted){back+=dt; if(back>1){melted=false;back=0}}} else back=0;
    bar.style.width=(melted?100:hold/3*100)+'%';
    if(have)msg.textContent=melted?'Всё стекло! Подними голову — симбионт вернётся':(nod?'Держи голову…':'Руку выше головы — шипы · Ладони вместе — шар · Руки в стороны — крылья · Наклони голову на 3 с — всё стечёт');

    const m={melted,
      up:{L:L[15].y>L[0].y+.05&&vis[15]>.4,R:L[16].y>L[0].y+.05&&vis[16]>.4},
      orb:vis[15]>.4&&vis[16]>.4&&L[15].distanceTo(L[16])<sw*.55,
      wings:vis[15]>.4&&vis[16]>.4&&Math.abs(L[15].x-L[16].x)>sw*3.1};
    if(m.orb){m.up.L=m.up.R=false}

    const hideLow=have?0:1;
    P.forEach((p,i)=>{
      const rad=(p.type==='h'?head.r*.22:p.type==='q'?sw*.14:sw*.11)*p.s*(1+.12*Math.sin(time*3+p.ph));
      let show=true;
      if(p.type==='b'&&(vis[p.a]<.35||vis[p.b]<.35))show=false;
      if(melted){
        p.vel.y-=3*dt; p.pos.addScaledVector(p.vel,dt);
        const fl=-1+rad;
        if(p.pos.y<fl){p.pos.y=fl;p.vel.y=0;p.vel.x*=.9;p.pos.x+=p.slide*dt}
        show=true;
      } else if(show){
        const tg=target(p,time,m,sw,head);
        p.pos.lerp(tg,1-Math.pow(1-p.k,dt*60));
        if(p.pos.y<-5)p.pos.copy(tg);
      }
      dummy.position.copy(p.pos);
      dummy.scale.setScalar(show&&!hideLow?rad:0);
      dummy.updateMatrix(); mesh.setMatrixAt(i,dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate=true;
    renderer.render(scene,cam);
  }
  msg.textContent='Готово!';
  requestAnimationFrame(loop);
}
</script></body></html>
