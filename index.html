<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отслеживание руки и фигуры</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
    }

    #info {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #00e676;
    }

    .container {
      position: relative;
      width: 640px;
      height: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Видео скрыто, отображение идёт через Canvas */
    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Зеркальное отображение */
    }
  </style>

  <!-- Подключение MediaPipe Hands и Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Отслеживание руки и фигуры</h1>
  <div id="info">Загрузка камеры...</div>

  <div class="container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const infoDiv = document.getElementById('info');

    // Функция проверки разогнутых пальцев
    function countFingers(landmarks) {
      let count = 0;

      // 1. Большой палец (проверяем X положение относительно сустава в зависимости от руки)
      // Для простоты сравниваем расстояние по X
      const isRightHand = landmarks[0].x < landmarks[9].x; 
      if (isRightHand) {
        if (landmarks[4].x < landmarks[3].x) count++;
      } else {
        if (landmarks[4].x > landmarks[3].x) count++;
      }

      // 2. Указательный
      if (landmarks[8].y < landmarks[6].y) count++;
      // 3. Средний
      if (landmarks[12].y < landmarks[10].y) count++;
      // 4. Безымянный
      if (landmarks[16].y < landmarks[14].y) count++;
      // 5. Мизинец
      if (landmarks[20].y < landmarks[18].y) count++;

      return count;
    }

    // Функция рисования правильного многоугольника
    function drawShape(ctx, centerX, centerY, radius, sides) {
      if (sides <= 0) return;

      ctx.beginPath();
      
      // Если 0 пальцев — рисуем одну точку
      if (sides === 1) {
        ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
        ctx.fillStyle = '#ff1744';
        ctx.fill();
        return;
      }

      // Если 1+ пальцев — рисуем фигуру с (sides) вершинами
      const step = (2 * Math.PI) / sides;
      const startAngle = -Math.PI / 2; // Начинаем сверху

      for (let i = 0; i < sides; i++) {
        const x = centerX + radius * Math.cos(startAngle + i * step);
        const y = centerY + radius * Math.sin(startAngle + i * step);

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      if (sides > 2) {
        ctx.closePath();
        ctx.fillStyle = 'rgba(0, 230, 118, 0.2)';
        ctx.fill();
      }

      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Рисуем сам вершины (точки)
      for (let i = 0; i < sides; i++) {
        const x = centerX + radius * Math.cos(startAngle + i * step);
        const y = centerY + radius * Math.sin(startAngle + i * step);
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffea00';
        ctx.fill();
      }
    }

    // Обработка результатов MediaPipe
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Рисуем изображение с видеокамеры
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Подсчитываем пальцы
        const fingersUp = countFingers(landmarks);

        // Фигура имеет на 1 точку больше или равна кол-ву пальцев (0 пальцев = 1 точка)
        const totalPoints = fingersUp === 0 ? 1 : fingersUp + 1;

        infoDiv.innerText = `Разогнуто пальцев: ${fingersUp} | Точек у фигуры: ${totalPoints}`;

        // Находим центр ладони (по точке 9 — основание среднего пальца)
        const centerX = landmarks[9].x * canvasElement.width;
        const centerY = landmarks[9].y * canvasElement.height;

        // Рисуем фигуру поверх ладони
        drawShape(canvasCtx, centerX, centerY, 80, totalPoints);
      } else {
        infoDiv.innerText = 'Покажите руку в камеру';
      }

      canvasCtx.restore();
    }

    // Инициализация MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Подключение веб-камеры
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
