<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D PARTICLE SUIT — Mobile AR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
  
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: #000; z-index: 1;
  }
  
  #c3d {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  
  /* Полноэкранный мобильный оверлей */
  #overlay {
    position: fixed; inset: 0; z-index: 999; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: #050b10; color: #00e5ff; text-align: center; padding: 24px;
  }
  
  /* Сенсорная кнопка под палец */
  .start-btn {
    font-size: 20px; font-weight: 700; padding: 20px 48px; border-radius: 50px;
    background: #00e5ff; color: #000; border: none; cursor: pointer;
    box-shadow: 0 0 30px rgba(0,229,255,0.6); margin-top: 24px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    width: 100%; max-width: 280px;
  }
  .start-btn:active { transform: scale(0.95); background: #80f3ff; }

  #msg-box {
    margin-top: 20px; font-size: 14px; line-height: 1.4; color: #ff8a7a;
    max-width: 300px; min-height: 20px;
  }

  #status-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; padding: 8px 18px; border-radius: 20px;
    background: rgba(0,0,0,0.75); border: 1px solid #00e5ff;
    color: #00e5ff; font-size: 12px; font-weight: 600; text-align: center;
    pointer-events: none; display: none;
  }
</style>

<!-- Подключение Three.js и MediaPipe Pose -->
<script src="https://cdnjs.cloudflare.net/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<video id="video" playsinline muted autoplay></video>
<canvas id="c3d"></canvas>

<div id="status-bar">⚡ Инициализация 3D костюма...</div>

<div id="overlay">
  <h1 style="font-size:24px; letter-spacing:1px;">NANO SUIT 3D</h1>
  <p style="color:#aaa; font-size:14px; margin-top:8px;">Объёмный костюм из частиц</p>
  
  <button class="start-btn" id="mainBtn" type="button">ВКЛЮЧИТЬ КАМЕРУ</button>
  <div id="msg-box"></div>
</div>

<script>
(() => {
'use strict';

const video = document.getElementById('video');
const canvas3D = document.getElementById('c3d');
const overlay = document.getElementById('overlay');
const mainBtn = document.getElementById('mainBtn');
const msgBox = document.getElementById('msg-box');
const statusBar = document.getElementById('status-bar');

let W = window.innerWidth, H = window.innerHeight;

// --- 1. THREE.JS 3D СЦЕНА ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

let visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 5;
let visibleWidth = visibleHeight * camera.aspect;

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 5;
  visibleWidth = visibleHeight * camera.aspect;
});

// --- 2. СИСТЕМА 3D ЧАСТИЦ (2000 точек) ---
const PARTICLE_COUNT = 2000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
  positions[i] = 0; positions[i + 1] = 0; positions[i + 2] = 0;
  colors[i] = 0.0;
  colors[i + 1] = 0.85 + Math.random() * 0.15;
  colors[i + 2] = 1.0;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const pCanvas = document.createElement('canvas');
pCanvas.width = 16; pCanvas.height = 16;
const pCtx = pCanvas.getContext('2d');
const grad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.4, 'rgba(0,229,255,0.8)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
pCtx.fillStyle = grad; pCtx.fillRect(0, 0, 16, 16);

const pTexture = new THREE.CanvasTexture(pCanvas);

const material = new THREE.PointsMaterial({
  size: 0.09,
  map: pTexture,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

// --- 3. ПОСТРОЕНИЕ 3D ОБЪЕМА НА ТЕЛЕ ---
const BONES = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24],
  [23, 25], [24, 26], [25, 27], [26, 28]
];

function updateParticlesFromPose(landmarks) {
  const posAttr = geometry.attributes.position;
  let pIdx = 0;

  const toWorld3D = (lm) => new THREE.Vector3(
    ((1 - lm.x) - 0.5) * visibleWidth,
    (0.5 - lm.y) * visibleHeight,
    -lm.z * 1.5
  );

  const now = performance.now() * 0.003;

  BONES.forEach(([i, j]) => {
    if (!landmarks[i] || !landmarks[j]) return;
    const pA = toWorld3D(landmarks[i]);
    const pB = toWorld3D(landmarks[j]);

    const particlesPerBone = 140;
    const radius = 0.16;

    for (let k = 0; k < particlesPerBone; k++) {
      if (pIdx >= PARTICLE_COUNT) break;

      const t = k / particlesPerBone;
      const angle = (k * 137.5) * (Math.PI / 180) + now;

      const cx = pA.x + (pB.x - pA.x) * t;
      const cy = pA.y + (pB.y - pA.y) * t;
      const cz = pA.z + (pB.z - pA.z) * t;

      const offsetX = Math.cos(angle) * radius;
      const offsetZ = Math.sin(angle) * radius;

      posAttr.setXYZ(pIdx, cx + offsetX, cy, cz + offsetZ);
      pIdx++;
    }
  });

  if (landmarks[0]) {
    const head = toWorld3D(landmarks[0]);
    while (pIdx < PARTICLE_COUNT) {
      const a1 = Math.random() * Math.PI * 2;
      const a2 = Math.random() * Math.PI * 2;
      const r = 0.22;
      posAttr.setXYZ(
        pIdx,
        head.x + Math.sin(a1) * Math.cos(a2) * r,
        head.y + Math.sin(a1) * Math.sin(a2) * r,
        head.z + Math.cos(a1) * r
      );
      pIdx++;
    }
  }

  posAttr.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y = Math.sin(performance.now() * 0.001) * 0.03;
  renderer.render(scene, camera);
}
animate();

// --- 4. НЕЙРОСЕТЬ MEDIAPIPE ---
let poseModel = null;

function initPose() {
  try {
    poseModel = new Pose({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
    });

    poseModel.setOptions({
      modelComplexity: 0,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    poseModel.onResults((results) => {
      if (results.poseLandmarks) {
        updateParticlesFromPose(results.poseLandmarks);
        statusBar.textContent = '✨ Нано-костюм активен';
      }
    });
  } catch (e) {
    console.warn("Ошибка Pose:", e);
  }
}

// --- 5. ОБРАБОТЧИК КНОПКИ ЗАПУСКА ---
async function startApp() {
  mainBtn.disabled = true;
  mainBtn.textContent = "ПОДКЛЮЧЕНИЕ...";
  msgBox.style.color = "#00e5ff";
  msgBox.textContent = "Запрашиваем доступ к веб-камере...";

  // Проверка на встроенные браузеры мессенджеров
  const ua = navigator.userAgent || "";
  if (/Telegram|Instagram|FB_IAB|Line|VK/i.test(ua)) {
    msgBox.style.color = "#ff8a7a";
    msgBox.textContent = "⚠️ Откройте сайт через Google Chrome или Safari! Встроенный браузер мессенджера блокирует камеру.";
    mainBtn.disabled = false;
    mainBtn.textContent = "ПОВТОРИТЬ";
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    // Скрываем меню
    overlay.style.display = 'none';
    statusBar.style.display = 'block';

    initPose();

    let isProcessing = false;
    async function processLoop() {
      if (video.readyState >= 2 && poseModel && !isProcessing) {
        isProcessing = true;
        try {
          await poseModel.send({ image: video });
        } catch (err) {
          console.warn(err);
        }
        isProcessing = false;
      }
      requestAnimationFrame(processLoop);
    }
    processLoop();

  } catch (err) {
    console.error(err);
    mainBtn.disabled = false;
    mainBtn.textContent = "ПОВТОРИТЬ";
    msgBox.style.color = "#ff8a7a";

    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      msgBox.textContent = "Камера заблокирована. Нажмите на иконку замочка возле адреса сайта и разрешите доступ к камере.";
    } else {
      msgBox.textContent = "Не удалось открыть камеру: " + (err.message || err.name);
    }
  }
}

// Слушатели нажатий под мобильные тач-экраны
mainBtn.addEventListener('click', startApp);
mainBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startApp();
}, { passive: false });

})();
</script>
</body>
</html>
