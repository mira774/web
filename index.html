<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магия Рук — Интерактивный Сайт</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #webcam {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 200px;
      height: 150px;
      border-radius: 12px;
      transform: scaleX(-1); /* Зеркалим видео */
      border: 2px solid #38bdf8;
      z-index: 10;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }
    h1 { margin: 0 0 5px 0; font-size: 24px; color: #38bdf8; text-shadow: 0 0 10px #38bdf8; }
    p { margin: 3px 0; color: #94a3b8; font-size: 14px; }
  </style>

  <!-- Подключаем библиотеки MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="info">
    <h1>🪄 Колдовство Руками</h1>
    <p>1. Подвигай указательным пальцем — за ним летит неоновая магия.</p>
    <p>2. Соедини большой и указательный палец (щепоть) — создастся 🟦 **Квадрат**.</p>
    <p>3. Выпрями ✌️ 2 пальца (указательный + средний) — создастся 🔺 **Треугольник**.</p>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const shapes = []; // Хранилище созданных фигур
    const particles = []; // Искры за пальцем

    // Обработка кадров нейросетью MediaPipe
    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Отрисовка сохраненных фигур
      shapes.forEach(shape => shape.draw());

      // Отрисовка магии/частиц
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(index, 1);
      });

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Координаты указательного пальца (точка №8) и большого (№4)
        // Зеркалим по X, чтобы движение совпадало с экраном
        const indexTip = {
          x: (1 - landmarks[8].x) * canvas.width,
          y: landmarks[8].y * canvas.height
        };
        const thumbTip = {
          x: (1 - landmarks[4].x) * canvas.width,
          y: landmarks[4].y * canvas.height
        };
        const middleTip = {
          x: (1 - landmarks[12].x) * canvas.width,
          y: landmarks[12].y * canvas.height
        };

        // Создаем неоновые искры за указательным пальцем
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(indexTip.x, indexTip.y));
        }

        // 1. ЖЕСТ 1: Щепоть (Большой + Указательный палец близко)
        const distancePinch = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
        if (distancePinch < 40) {
          shapes.push(new Shape(indexTip.x, indexTip.y, 'square'));
        }

        // 2. ЖЕСТ 2: Виктори / 2 пальца близко друг к другу
        const distancePeace = Math.hypot(indexTip.x - middleTip.x, indexTip.y - middleTip.y);
        if (distancePeace < 45 && indexTip.y < landmarks[6].y * canvas.height) {
          shapes.push(new Shape(indexTip.x, indexTip.y, 'triangle'));
        }

        // Отрисовка курсора на кончике пальца
        ctx.fillStyle = '#ff007f';
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff007f';
      }
    }

    // Класс магических частиц
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.life = 1;
        this.color = `hsl(${Math.random() * 60 + 180}, 100%, 60%)`;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.03;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Класс геометрии (Квадраты и Треугольники)
    class Shape {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.size = Math.random() * 30 + 30;
        this.color = type === 'square' ? '#38bdf8' : '#a855f7';
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        if (this.type === 'square') {
          ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
        } else if (this.type === 'triangle') {
          ctx.moveTo(this.x, this.y - this.size);
          ctx.lineTo(this.x - this.size, this.y + this.size);
          ctx.lineTo(this.x + this.size, this.y + this.size);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    // Инициализация MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Запуск веб-камеры
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
