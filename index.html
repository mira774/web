<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spatial AR Fighting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #050b14; font-family: system-ui, sans-serif; color: #fff; }

  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #webcam { display: none; }

  /* ХП Бары участников */
  #hp-container {
    position: fixed; top: 15px; left: 15px; right: 15px; z-index: 10;
    display: flex; justify-content: space-between; gap: 15px;
    pointer-events: none;
  }

  .hp-card {
    flex: 1; max-width: 280px; background: rgba(10, 20, 30, 0.85);
    padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.3);
    backdrop-filter: blur(8px);
  }

  .hp-bar-bg { width: 100%; height: 16px; background: #222; border-radius: 8px; overflow: hidden; margin-top: 6px; border: 1px solid #444; }
  .hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); transition: width 0.2s ease; }
  .hp-bar-fill.my { background: linear-gradient(90deg, #00e5ff, #00ff66); }

  /* Панель управления и подключения */
  #ui-panel {
    position: fixed; bottom: 15px; left: 15px; right: 15px; z-index: 10;
    background: rgba(10, 20, 30, 0.9); padding: 12px 16px; border-radius: 16px;
    border: 1px solid rgba(0, 229, 255, 0.4); display: flex; flex-direction: column; gap: 8px;
    backdrop-filter: blur(8px);
  }

  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; }
  
  input[type="text"] {
    background: #111; border: 1px solid #333; color: #fff; padding: 8px 12px;
    border-radius: 8px; font-size: 13px; flex: 1; outline: none;
  }

  .btn {
    background: #00e5ff; color: #000; border: none; padding: 8px 14px;
    font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 13px;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); background: #70f0ff; }
  .btn-weapon { background: #1a2936; color: #00e5ff; border: 1px solid #00e5ff; flex: 1; text-align: center; }
  .btn-weapon.active { background: #00e5ff; color: #000; }

  #status { font-size: 12px; color: #aaa; text-align: center; }
  #my-id { color: #00e5ff; font-weight: bold; user-select: all; }
</style>

<!-- PeerJS и MediaPipe -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="hp-container">
  <div class="hp-card">
    <div class="row"><b>ВЫ</b> <span id="my-hp-text">100 HP</span></div>
    <div class="hp-bar-bg"><div id="my-hp-bar" class="hp-bar-fill my"></div></div>
  </div>
  <div class="hp-card">
    <div class="row"><b>СОПЕРНИК</b> <span id="enemy-hp-text">100 HP</span></div>
    <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar-fill"></div></div>
  </div>
</div>

<canvas id="gameCanvas"></canvas>
<video id="webcam" autoplay playsinline muted></video>

<div id="ui-panel">
  <div class="row">
    <span>Мой ID: <span id="my-id">Загрузка...</span></span>
    <button class="btn" onclick="document.getElementById('bgLoader').click()">🖼️ Фон</button>
    <input type="file" id="bgLoader" accept="image/*" style="display:none">
  </div>
  
  <div class="row">
    <input type="text" id="peer-input" placeholder="ID друга">
    <button class="btn" id="connect-btn">Войти в дуэль</button>
  </div>

  <div class="row">
    <button class="btn btn-weapon active" onclick="setWeapon('machete', this)">🗡️ Мачете</button>
    <button class="btn btn-weapon" onclick="setWeapon('bat', this)">🏏 Бита</button>
    <button class="btn btn-weapon" onclick="setWeapon('sword', this)">⚔️ Меч</button>
    <button class="btn btn-weapon" onclick="setWeapon('shield', this)">🛡️ Щит</button>
  </div>

  <div id="status">Запуск камеры...</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const webcam = document.getElementById('webcam');
const status = document.getElementById('status');
const myIdEl = document.getElementById('my-id');
const peerInput = document.getElementById('peer-input');
const connectBtn = document.getElementById('connect-btn');
const bgLoader = document.getElementById('bgLoader');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
});

// --- 1. СОСТОЯНИЕ ИГРОКОВ ---
const myPlayer = {
  x: W * 0.3, y: H * 0.7,
  hp: 100,
  weapon: 'machete',
  weaponX: W * 0.3, weaponY: H * 0.6,
  prevWX: 0, prevWY: 0,
  size: 220
};

const enemyPlayer = {
  x: W * 0.7, y: H * 0.7,
  hp: 100,
  weapon: 'machete',
  weaponX: W * 0.7, weaponY: H * 0.6,
  size: 220,
  active: false
};

// Текстовые эффекты урона (-20 HP)
const damageTexts = [];

function addDamageEffect(x, y, amount) {
  damageTexts.push({ x, y, amount, alpha: 1.0 });
}

// --- 2. МУЛЬТИПЛЕЕР (PEERJS) ---
const peer = new Peer();
let dataConn = null;

peer.on('open', (id) => {
  myIdEl.textContent = id;
  status.textContent = "Готов! Скопируйте свой ID или введите ID друга.";
});

peer.on('connection', (conn) => setupConnection(conn));

connectBtn.addEventListener('click', () => {
  const targetId = peerInput.value.trim();
  if (targetId) setupConnection(peer.connect(targetId));
});

function setupConnection(conn) {
  dataConn = conn;
  enemyPlayer.active = true;
  status.textContent = "⚔️ Дуэль началась! Бейте соперника оружием!";

  conn.on('data', (data) => {
    if (data.type === 'state') {
      enemyPlayer.x = data.x;
      enemyPlayer.y = data.y;
      enemyPlayer.weaponX = data.wx;
      enemyPlayer.weaponY = data.wy;
      enemyPlayer.weapon = data.weapon;
      enemyPlayer.hp = data.hp;
      updateHPBars();
    } else if (data.type === 'hit') {
      myPlayer.hp = Math.max(0, myPlayer.hp - data.damage);
      addDamageEffect(myPlayer.x, myPlayer.y - 50, data.damage);
      updateHPBars();
      sendState();
    }
  });

  conn.on('close', () => {
    enemyPlayer.active = false;
    status.textContent = "Соперник вышел из дуэли";
  });
}

function sendState() {
  if (dataConn && dataConn.open) {
    dataConn.send({
      type: 'state',
      x: myPlayer.x, y: myPlayer.y,
      wx: myPlayer.weaponX, wy: myPlayer.weaponY,
      weapon: myPlayer.weapon, hp: myPlayer.hp
    });
  }
}

function updateHPBars() {
  document.getElementById('my-hp-text').textContent = myPlayer.hp + ' HP';
  document.getElementById('my-hp-bar').style.width = myPlayer.hp + '%';

  document.getElementById('enemy-hp-text').textContent = enemyPlayer.hp + ' HP';
  document.getElementById('enemy-hp-bar').style.width = enemyPlayer.hp + '%';
}

// --- 3. СМЕНА ОРУЖИЯ ---
function setWeapon(type, btnEl) {
  myPlayer.weapon = type;
  document.querySelectorAll('.btn-weapon').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  sendState();
}

// --- 4. УПРАВЛЕНИЕ И АТАКА ---
let isDragging = false;
let lastHitTime = 0;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  updatePos(e.clientX, e.clientY);
});

canvas.addEventListener('pointermove', (e) => {
  if (isDragging) updatePos(e.clientX, e.clientY);
});

window.addEventListener('pointerup', () => isDragging = false);

function updatePos(cx, cy) {
  myPlayer.x = cx;
  myPlayer.y = cy;
  
  // Оружие держится в правой руке с отступом
  myPlayer.weaponX = cx + 50;
  myPlayer.weaponY = cy - 30;

  // Проверка скорости удара
  const speed = Math.hypot(myPlayer.weaponX - myPlayer.prevWX, myPlayer.weaponY - myPlayer.prevWY);
  myPlayer.prevWX = myPlayer.weaponX;
  myPlayer.prevWY = myPlayer.weaponY;

  // Проверка попадания по врагу
  if (enemyPlayer.active && speed > 15 && Date.now() - lastHitTime > 400) {
    const distToEnemy = Math.hypot(myPlayer.weaponX - enemyPlayer.x, myPlayer.weaponY - enemyPlayer.y);
    if (distToEnemy < 100) { // Попадание!
      lastHitTime = Date.now();
      const dmg = 20;
      enemyPlayer.hp = Math.max(0, enemyPlayer.hp - dmg);
      addDamageEffect(enemyPlayer.x, enemyPlayer.y - 50, dmg);
      updateHPBars();

      if (dataConn) {
        dataConn.send({ type: 'hit', damage: dmg });
      }
    }
  }

  sendState();
}

// --- 5. ВЫРЕЗАНИЕ ФОНА КАМЕРЫ (MediaPipe) ---
const segCanvas = document.createElement('canvas');
segCanvas.width = 240; segCanvas.height = 240;
const segCtx = segCanvas.getContext('2d');
let isSegmentationReady = false;

const selfieSegmentation = new SelfieSegmentation({
  locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
});
selfieSegmentation.setOptions({ modelSelection: 1 });

selfieSegmentation.onResults((results) => {
  segCtx.save();
  segCtx.clearRect(0, 0, 240, 240);
  segCtx.drawImage(results.segmentationMask, 0, 0, 240, 240);
  segCtx.globalCompositeOperation = 'source-in';
  
  // Правильное отзеркаливание
  segCtx.translate(240, 0);
  segCtx.scale(-1, 1);
  segCtx.drawImage(results.image, 0, 0, 240, 240);
  segCtx.restore();

  isSegmentationReady = true;
});

// --- 6. ОТРИСОВКА ОРУЖИЯ И АРЕНЫ ---
let bgImage = new Image();
let hasBg = false;

bgLoader.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => { bgImage.src = ev.target.result; hasBg = true; };
    reader.readAsDataURL(file);
  }
});

function drawWeapon(x, y, type) {
  ctx.save();
  ctx.translate(x, y);
  
  if (type === 'machete') {
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(-5, -40, 10, 50);
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(-3, 10, 6, 15);
  } else if (type === 'bat') {
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(-8, -50, 16, 60);
  } else if (type === 'sword') {
    ctx.fillStyle = '#00e5ff';
    ctx.fillRect(-4, -60, 8, 70);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-15, 10, 30, 6);
  } else if (type === 'shield') {
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 4; ctx.stroke();
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // Отрисовка фона
  if (hasBg && bgImage.complete) {
    ctx.drawImage(bgImage, 0, 0, W, H);
  } else {
    // Арена по умолчанию
    ctx.strokeStyle = '#152238'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  // Отрисовка Соперника
  if (enemyPlayer.active) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(enemyPlayer.x, enemyPlayer.y, 60, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 0, 85, 0.3)'; ctx.fill();
    ctx.restore();

    // Силуэт соперника (рамка или вырезанный видеопоток)
    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3;
    ctx.strokeRect(enemyPlayer.x - 60, enemyPlayer.y - 180, 120, 180);

    drawWeapon(enemyPlayer.weaponX, enemyPlayer.weaponY, enemyPlayer.weapon);
  }

  // Отрисовка Моего персонажа
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(myPlayer.x, myPlayer.y, 60, 15, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 229, 255, 0.3)'; ctx.fill();
  ctx.restore();

  if (isSegmentationReady) {
    ctx.drawImage(segCanvas, myPlayer.x - 80, myPlayer.y - 200, 160, 200);
  } else if (webcam.readyState >= 2) {
    ctx.drawImage(webcam, myPlayer.x - 80, myPlayer.y - 200, 160, 200);
  }

  drawWeapon(myPlayer.weaponX, myPlayer.weaponY, myPlayer.weapon);

  // Отрисовка цифр урона (-20)
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    const dt = damageTexts[i];
    ctx.fillStyle = `rgba(255, 0, 85, ${dt.alpha})`;
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('-' + dt.amount, dt.x, dt.y);
    dt.y -= 1.5;
    dt.alpha -= 0.02;
    if (dt.alpha <= 0) damageTexts.splice(i, 1);
  }

  requestAnimationFrame(render);
}

// --- 7. БЕЗОПАСНЫЙ ЗАПУСК КАМЕРЫ И ИГРЫ ---
async function start() {
  render(); // Игра рисуется сразу! Без ожиданий

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } },
      audio: false
    });
    webcam.srcObject = stream;
    await webcam.play();
    status.textContent = "Камера подключена! Нейросеть запускается...";

    // Фоновый запуск нейросети вырезания фона
    async function processCamera() {
      if (webcam.readyState >= 2) {
        try { await selfieSegmentation.send({ image: webcam }); } catch (e) {}
      }
      requestAnimationFrame(processCamera);
    }
    processCamera();
  } catch (err) {
    status.textContent = "Камера недоступна (управление пальцем работает): " + err.message;
  }
}

start();
</script>
</body>
</html>
