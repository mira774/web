<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUB // Network System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-card: rgba(15, 21, 32, 0.85);
            --border-line: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.35);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-aura: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --tg-bg-msg: #182533;
            --tg-bg-mine: #2b5278;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .admin-red-badge {
            font-weight: 800; font-size: 0.65rem; padding: 2px 6px; border-radius: 6px;
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.4); color: #f87171;
            display: inline-flex; align-items: center; gap: 3px; vertical-align: middle; margin-left: 4px;
        }

        #top-navbar {
            height: 65px; background: rgba(10, 14, 23, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-line); padding: 0 20px; display: flex;
            align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50;
        }

        .brand { font-weight: 800; font-size: 1.2rem; color: var(--accent-cyan); letter-spacing: -0.5px; }
        .brand span { color: var(--accent-purple); }

        .nav-menu { display: flex; gap: 4px; background: rgba(0, 0, 0, 0.4); padding: 3px; border-radius: 12px; border: 1px solid var(--border-line); }
        .nav-btn {
            padding: 6px 14px; border-radius: 99px; color: var(--text-muted); font-weight: 700; font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; display: flex; align-items: center; gap: 5px;
        }
        .nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
        .nav-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(168, 85, 247, 0.15));
            color: var(--accent-cyan); border-color: var(--border-glow); box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        .user-pill {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-line); padding: 4px 10px; border-radius: 20px;
            font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer;
        }

        .avatar-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-cyan); background: #111; }
        .avatar-img-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-cyan); background: #111; cursor: pointer; flex-shrink: 0; }

        .btn {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7); color: #fff; border: none; padding: 10px 18px;
            border-radius: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        .btn-purple { background: linear-gradient(135deg, var(--accent-purple), #7e22ce); box-shadow: 0 4px 12px rgba(126, 34, 206, 0.25); }
        .btn-green { background: linear-gradient(135deg, var(--accent-green), #059669); color: #000; box-shadow: 0 4px 12px rgba(52, 211, 153, 0.25); }
        .btn-outline { background: transparent; border: 1px solid var(--border-line); color: var(--text-main); box-shadow: none; }
        .btn-outline:hover { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.08); }

        .btn-console {
            background: rgba(168, 85, 247, 0.15); border: 1px solid var(--accent-purple); color: var(--accent-purple);
            padding: 4px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 3px;
        }

        #main-container { flex: 1; padding: 20px; max-width: 1100px; width: 100%; margin: 0 auto; }
        .tab-panel { display: none; animation: fadeIn 0.2s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-line); border-radius: 16px; padding: 18px; margin-bottom: 16px;
            backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }

        .input-field {
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-line); padding: 10px 14px; border-radius: 10px;
            color: #fff; outline: none; font-size: 16px; transition: 0.2s; width: 100%;
        }

        .badge { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; display: inline-flex; align-items: center; gap: 4px; }
        .badge-elo { background: rgba(251, 191, 36, 0.12); color: var(--accent-yellow); border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-aura { background: rgba(236, 72, 153, 0.12); color: var(--accent-aura); border: 1px solid rgba(236, 72, 153, 0.3); }
        .badge-wins { background: rgba(52, 211, 153, 0.12); color: var(--accent-green); border: 1px solid rgba(52, 211, 153, 0.3); }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th { text-align: left; padding: 10px 8px; color: var(--text-muted); font-size: 0.75rem; border-bottom: 1px solid var(--border-line); }
        .leaderboard-table td { padding: 12px 8px; border-bottom: 1px solid var(--border-line); font-size: 0.85rem; }

        .chat-box {
            display: flex; flex-direction: column; height: 460px; background: #0e1621; border-radius: 14px;
            border: 1px solid var(--border-line); overflow: hidden; margin-top: 14px; position: relative;
        }
        .chat-header {
            padding: 10px 16px; background: #17212b; border-bottom: 1px solid rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
        }
        .chat-messages {
            flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            background: #0e1621; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0); background-size: 18px 18px;
        }
        .chat-msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; width: fit-content; }
        .chat-msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
        
        .chat-msg-item {
            background: var(--tg-bg-msg); border-radius: 10px 10px 10px 2px; padding: 8px 12px; position: relative; word-break: break-word; flex: 1;
        }
        .chat-msg-row.mine .chat-msg-item { background: var(--tg-bg-mine); border-radius: 10px 10px 2px 10px; }
        .chat-msg-header { display: flex; justify-content: space-between; gap: 10px; font-size: 0.7rem; margin-bottom: 3px; color: var(--text-muted); align-items: center; }

        .chat-input-bar {
            padding: 8px 12px; background: #17212b; border-top: 1px solid rgba(0,0,0,0.3); display: flex; align-items: center; gap: 6px;
        }
        .icon-btn-tg {
            background: transparent; border: none; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: #7f91a4; transition: 0.2s; flex-shrink: 0;
        }
        .icon-btn-tg svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; }
        .icon-btn-tg:hover { background: rgba(255,255,255,0.08); color: var(--accent-cyan); }

        .empty-card { text-align: center; padding: 20px; color: var(--text-muted); border: 1px dashed var(--border-line); border-radius: 12px; font-size: 0.82rem; }

        @media (max-width: 768px) {
            #top-navbar { padding: 0 12px; height: 56px; }
            .brand { font-size: 1.05rem; }
            .nav-menu { gap: 2px; padding: 2px; }
            .nav-btn { padding: 5px 10px; font-size: 0.72rem; }
            #main-container { padding: 12px; }
            .chat-box { height: 400px; }
        }
    </style>
</head>
<body>

    <header id="top-navbar">
        <div class="brand">SYSTEM<span>HUB</span></div>
        <nav class="nav-menu">
            <div class="nav-btn active" onclick="switchTab('home', this)">
                <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Главная
            </div>
            <div class="nav-btn" onclick="switchTab('news', this)">
                <svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 10h-5"/><path d="M10 18h8"/></svg>
                Новости
            </div>
            <div class="nav-btn" onclick="switchTab('games', this)">
                <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/><line x1="12" y1="6" x2="12" y2="18"/></svg>
                Игры
            </div>
        </nav>
        <div class="user-pill">
            <img id="display-avatar" class="avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>" alt="Avatar">
            <div style="display: flex; flex-direction: column;">
                <strong id="display-sitenick" style="color: #fff; font-size: 0.8rem;">Гость</strong>
            </div>
        </div>
    </header>

    <main id="main-container">
        <section id="panel-home" class="tab-panel active">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-weight: 800; font-size: 1.05rem;">Глобальный Чат</h3>
                </div>
                
                <div id="chat-window" class="chat-box">
                    <div class="chat-header">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%;"></div>
                            <h4 style="font-size: 0.9rem; color: #fff;">Онлайн Чат</h4>
                        </div>
                    </div>

                    <div id="chat-messages" class="chat-messages">
                        <div class="empty-card" style="background: transparent; border: none;">Загрузка сообщений...</div>
                    </div>

                    <div class="chat-input-bar">
                        <input type="text" id="chat-input" class="input-field" style="border-radius: 20px; padding: 8px 14px;" placeholder="Сообщение..." onkeypress="handleChatEnter(event)">
                        <button class="icon-btn-tg" title="Отправить" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="panel-news" class="tab-panel">
            <div class="card">
                <h3 style="font-size: 1.05rem;">Раздел новостей</h3>
                <p style="color: var(--text-muted); margin-top: 8px;">Скоро здесь будут новости проекта.</p>
            </div>
        </section>

        <section id="panel-games" class="tab-panel">
            <div class="card">
                <h3 style="font-size: 1.05rem;">Игровой раздел</h3>
                <p style="color: var(--text-muted); margin-top: 8px;">Раздел игр в разработке.</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://kbwssibbmqgboouordty.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_vQ0z4-s98JtU3nytmGiFjg_Hg0gjk98';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let messagesList = [];

        window.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            setupRealtime();
        });

        // Загрузка сообщений из базы
        async function loadMessages() {
            const { data, error } = await _supabase
                .from('messages')
                .select('*')
                .order('id', { ascending: true })
                .limit(50);
                
            if (!error && data) {
                messagesList = data;
                renderMessages();
            }
        }

        // Включение мгновенных обновлений (Realtime)
        function setupRealtime() {
            _supabase
                .channel('realtime:messages')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                    if (payload.eventType === 'INSERT') {
                        messagesList.push(payload.new);
                        renderMessages();
                    } else if (payload.eventType === 'DELETE') {
                        messagesList = messagesList.filter(m => String(m.id) !== String(payload.old.id));
                        renderMessages();
                    }
                })
                .subscribe();
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            await _supabase.from('messages').insert([{ username: 'Игрок', text: text }]);
        }

        // Удаление сообщения
        async function deleteMessage(id) {
            messagesList = messagesList.filter(m => String(m.id) !== String(id));
            renderMessages();
            await _supabase.from('messages').delete().eq('id', id);
        }

        // Отрисовка
        function renderMessages() {
            const container = document.getElementById('chat-messages');
            if (!messagesList.length) {
                container.innerHTML = `<div class="empty-card" style="background: transparent; border: none;">Сообщений пока нет. Напишите что-нибудь!</div>`;
                return;
            }

            container.innerHTML = messagesList.map(msg => `
                <div class="chat-msg-row">
                    <img class="avatar-img-sm" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>">
                    <div class="chat-msg-item">
                        <div class="chat-msg-header">
                            <b>${msg.username || 'Гость'}</b>
                            <button style="background:none; border:none; cursor:pointer;" onclick="deleteMessage('${msg.id}')">🗑️</button>
                        </div>
                        <div>${msg.text || ''}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function handleChatEnter(e) { if (e.key === 'Enter') sendMessage(); }
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + tabId).classList.add('active');
            if (el) el.classList.add('active');
        }
    </script>
</body>
</html>
