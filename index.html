<divЧтобы решить обе проблемы — идеальное вырезание фона без задержек и правильное отзеркаливание (чтобы двигался влево, и на экране всё шло влево) — мы объединим трекинг позы и сегментацию прямо внутри **MediaPipe Pose** (`enableSegmentation: true`). Это работает в разы быстрее, чем грузить две разные нейросети.

Что касается «общего глобала без ID»: чтобы сделать автоматический поиск комнаты без ввода цифр для реального онлайна, нужен сервер (ты можешь легко поднять его на своем Node.js + Supabase, передавая только координаты `X` и `Y` оружия). Но чтобы ты мог прямо сейчас протестировать физику отрывания конечностей и правильное стирание фона, я переделал код в **идеальную локальную песочницу**. Твое реальное тело будет вырезаться, отзеркаливаться как надо и управлять физическим оружием, которым можно крушить тряпичного манекена.

Замени код в `index.html` на этот:

```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Ragdoll Sandbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; color: #fff; }
  
  #gameCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  #videoElement { display: none; } /* Скрываем сырую камеру */

  #ui {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; z-index: 10;
  }

  .btn {
    background: rgba(0, 229, 255, 0.2); color: #00e5ff; border: 1px solid #00e5ff;
    padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px;
    font-weight: bold; backdrop-filter: blur(5px); text-transform: uppercase;
  }
  .btn:active { background: #00e5ff; color: #000; }
  
  #status { position: absolute; bottom: 20px; left: 20px; color: #aaa; font-size: 14px; }
</style>

<!-- Matter.js и MediaPipe Pose + Camera Utils для быстрого захвата -->
<script src="[https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js](https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js)"></script>
<script src="[https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js](https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js)" crossorigin="anonymous"></script>
<script src="[https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js](https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js)" crossorigin="anonymous"></script>
</head>
<body>

<div id="ui">
  <button class="btn" onclick="equip('machete')">🗡️ Мачете</button>
  <button class="btn" onclick="equip('bat')">🏏 Бита</button>
  <button class="btn" onclick="spawnDummy()">🤖 Спавн врага</button>
</div>

<video id="videoElement" autoplay playsinline muted></video>
<canvas id="gameCanvas"></canvas>
<div id="status">Запуск нейросети...</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

// Вспомогательный холст для быстрого вырезания фона
const maskCanvas = document.createElement('canvas');
const maskCtx = maskCanvas.getContext('2d');
maskCanvas.width = W; maskCanvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  maskCanvas.width = W; maskCanvas.height = H;
});

// --- 1. ФИЗИКА MATTER.JS ---
const Engine = Matter.Engine, Composite = Matter.Composite, 
      Bodies = Matter.Bodies, Constraint = Matter.Constraint, Vector = Matter.Vector;

const engine = Engine.create();
engine.gravity.y = 1.5;

// Границы арены
const ground = Bodies.rectangle(W/2, H, W, 60, { isStatic: true });
const leftWall = Bodies.rectangle(0, H/2, 60, H, { isStatic: true });
const rightWall = Bodies.rectangle(W, H/2, 60, H, { isStatic: true });
Composite.add(engine.world, [ground, leftWall, rightWall]);

let joints = [];
let handBody = Bodies.circle(W/2, H/2, 20, { isStatic: true, isSensor: true }); 
let weaponBody = null;
let weaponGrip = null;
Composite.add(engine.world, handBody); // Это наша невидимая рука, привязанная к вебке

function equip(type) {
  if (weaponBody) Composite.remove(engine.world, [weaponBody, weaponGrip]);

  if (type === 'machete') {
    weaponBody = Bodies.rectangle(handBody.position.x, handBody.position.y - 40, 15, 120, { render: { color: '#ccc' } });
  } else {
    weaponBody = Bodies.rectangle(handBody.position.x, handBody.position.y - 40, 25, 130, { render: { color: '#8b4513' } });
  }
  
  // Пружина, чтобы оружие слегка болталось в руке, но держалось крепко
  weaponGrip = Constraint.create({
    bodyA: handBody, bodyB: weaponBody,
    pointB: { x: 0, y: 50 }, stiffness: 0.8, length: 0
  });
  
  Composite.add(engine.world, [weaponBody, weaponGrip]);
}

function spawnDummy() {
  const x = W * 0.7; const y = H / 2;
  const group = Matter.Body.nextGroup(true);
  const opt = { collisionFilter: { group: group }, render: { color: '#ff0055' } };
  
  const head = Bodies.circle(x, y - 60, 25, opt);
  const torso = Bodies.rectangle(x, y, 50, 90, opt);
  const rArm = Bodies.rectangle(x + 40, y - 20, 20, 70, opt);
  const lArm = Bodies.rectangle(x - 40, y - 20, 20, 70, opt);
  const rLeg = Bodies.rectangle(x + 20, y + 70, 25, 80, opt);
  const lLeg = Bodies.rectangle(x - 20, y + 70, 25, 80, opt);

  const n = Constraint.create({ bodyA: torso, pointA: {x:0, y:-45}, bodyB: head, pointB: {x:0, y:25}, stiffness: 0.9, length: 0 });
  const rs = Constraint.create({ bodyA: torso, pointA: {x:25, y:-30}, bodyB: rArm, pointB: {x:0, y:-35}, stiffness: 0.8, length: 0 });
  const ls = Constraint.create({ bodyA: torso, pointA: {x:-25, y:-30}, bodyB: lArm, pointB: {x:0, y:-35}, stiffness: 0.8, length: 0 });
  const rh = Constraint.create({ bodyA: torso, pointA: {x:15, y:45}, bodyB: rLeg, pointB: {x:0, y:-40}, stiffness: 0.8, length: 0 });
  const lh = Constraint.create({ bodyA: torso, pointA: {x:-15, y:45}, bodyB: lLeg, pointB: {x:0, y:-40}, stiffness: 0.8, length: 0 });

  joints.push(n, rs, ls, rh, lh);
  Composite.add(engine.world, [head, torso, rArm, lArm, rLeg, lLeg, n, rs, ls, rh, lh]);
}

// Система отрыва конечностей
Matter.Events.on(engine, 'collisionStart', (event) => {
  event.pairs.forEach((pair) => {
    const force = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
    if (force > 30) { // Если удар быстрее 30 единиц
      for (let j = joints.length - 1; j >= 0; j--) {
        const jnt = joints[j];
        if (jnt.bodyA === pair.bodyA || jnt.bodyB === pair.bodyA || jnt.bodyA === pair.bodyB || jnt.bodyB === pair.bodyB) {
          Composite.remove(engine.world, jnt); // Сустав рвется
          joints.splice(j, 1);
        }
      }
    }
  });
});

// --- 2. MEDIAPIPE (Идеальное отзеркаливание и вырезание) ---
const videoElement = document.getElementById('videoElement');
const status = document.getElementById('status');
let isTracking = false;

const pose = new Pose({ locateFile: (file) => `[https://cdn.jsdelivr.net/npm/@mediapipe/pose/$](https://cdn.jsdelivr.net/npm/@mediapipe/pose/$){file}` });
pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  enableSegmentation: true, // Включаем вырезание фона прямо в Pose
  smoothSegmentation: true,
  minDetectionConfidence: 0.5
});

pose.onResults((results) => {
  isTracking = true;
  status.innerText = "Система активна. Возьми оружие!";

  // 1. Рисуем идеальный силуэт в маску (исправлено отзеркаливание!)
  maskCtx.save();
  maskCtx.clearRect(0, 0, W, H);
  maskCtx.translate(W, 0); 
  maskCtx.scale(-1, 1); // Зеркалим холст по горизонтали
  
  if (results.segmentationMask) {
    maskCtx.drawImage(results.segmentationMask, 0, 0, W, H);
    maskCtx.globalCompositeOperation = 'source-in';
    maskCtx.drawImage(results.image, 0, 0, W, H);
    maskCtx.globalCompositeOperation = 'source-over';
  }
  maskCtx.restore();

  // 2. Двигаем физическую невидимую руку (также зеркально)
  if (results.poseLandmarks) {
    const rightWrist = results.poseLandmarks[16];
    if (rightWrist.visibility > 0.5) {
      // (1 - x) гарантирует, что рука пойдет в нужную сторону
      const targetX = (1 - rightWrist.x) * W; 
      const targetY = rightWrist.y * H;
      Matter.Body.setPosition(handBody, { x: targetX, y: targetY });
    }
  }
});

const camera = new Camera(videoElement, {
  onFrame: async () => { await pose.send({ image: videoElement }); },
  width: 640, height: 480
});
camera.start();

// --- 3. ИГРОВОЙ ЦИКЛ (Отрисовка физики поверх твоего видео) ---
function drawWorld() {
  Engine.update(engine);
  ctx.clearRect(0, 0, W, H);

  // Рисуем тебя (уже вырезанного и отзеркаленного)
  if (isTracking) {
    ctx.drawImage(maskCanvas, 0, 0, W, H);
  }

  // Отрисовка всех тел из Matter.js
  engine.world.bodies.forEach(body => {
    if (body.isSensor) return; // Невидимую руку не рисуем
    ctx.beginPath();
    body.parts.forEach((part, idx) => {
      if (idx === 0 && body.parts.length > 1) return;
      ctx.moveTo(part.vertices[0].x, part.vertices[0].y);
      for (let j = 1; j < part.vertices.length; j++) {
        ctx.lineTo(part.vertices[j].x, part.vertices[j].y);
      }
      ctx.lineTo(part.vertices[0].x, part.vertices[0].y);
    });
    ctx.fillStyle = body.render.color || '#555';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
  });

  requestAnimationFrame(drawWorld);
}
drawWorld();
</script>
</body>
</html>
