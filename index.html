<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D PARTICLE SUIT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: #000; z-index: 1;
  }
  
  #c3d {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  
  #start-btn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 999; padding: 20px 40px; font-size: 18px; font-weight: bold;
    background: #00e5ff; color: #000; border: none; border-radius: 50px;
    box-shadow: 0 0 30px #00e5ff; cursor: pointer;
  }
  #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }

  #error-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 9999; background: rgba(255, 50, 50, 0.9); color: #fff;
    padding: 12px 24px; border-radius: 12px; font-size: 13px; display: none;
    text-align: center; max-width: 90%;
  }
</style>

<!-- Рабочие CDN библиотеки -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<video id="video" playsinline muted autoplay></video>
<canvas id="c3d"></canvas>

<button id="start-btn">ВКЛЮЧИТЬ 3D КОСТЮМ</button>
<div id="error-bar"></div>

<script>
const video = document.getElementById('video');
const canvas3D = document.getElementById('c3d');
const startBtn = document.getElementById('start-btn');
const errorBar = document.getElementById('error-bar');

function showError(msg) {
  errorBar.style.display = 'block';
  errorBar.textContent = msg;
}

// Проверка наличия загруженного Three.js
if (typeof THREE === 'undefined') {
  showError('Ошибка загрузки Three.js! Проверьте интернет-соединение.');
}

let W = window.innerWidth, H = window.innerHeight;

// --- 1. THREE.JS СЦЕНА ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// --- 2. СИСТЕМА ЧАСТИЦ ---
const PARTICLE_COUNT = 2000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
  positions[i] = 0; positions[i + 1] = 0; positions[i + 2] = 0;
  colors[i] = 0.0;
  colors[i + 1] = 0.85;
  colors[i + 2] = 1.0;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.08,
  color: 0x00e5ff,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

// --- 3. MEDIAPIPE ---
let pose = null;
if (typeof Pose !== 'undefined') {
  pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });
  pose.setOptions({ modelComplexity: 0, smoothLandmarks: true });
  pose.onResults((results) => {
    if (results.poseLandmarks) {
      const posAttr = geometry.attributes.position;
      let pIdx = 0;
      results.poseLandmarks.forEach((lm) => {
        if (pIdx < PARTICLE_COUNT * 3) {
          posAttr.array[pIdx] = -(lm.x - 0.5) * 4;
          posAttr.array[pIdx + 1] = -(lm.y - 0.5) * 3;
          posAttr.array[pIdx + 2] = -lm.z * 2;
          pIdx += 3;
        }
      });
      posAttr.needsUpdate = true;
    }
  });
}

// --- 4. ЗАПУСК КАМЕРЫ ---
startBtn.addEventListener('click', async () => {
  startBtn.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();

    async function processVideo() {
      if (video.readyState >= 2 && pose) {
        await pose.send({ image: video });
      }
      requestAnimationFrame(processVideo);
    }
    processVideo();
  } catch (e) {
    showError('Не удалось включить камеру: ' + e.message);
  }
});
</script>
</body>
</html>
