<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Video Chat 2D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }

  #viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; }

  /* UI Панель */
  #ui {
    position: fixed; top: 15px; left: 15px; z-index: 10;
    background: rgba(0,0,0,0.8); padding: 12px 18px; border-radius: 12px;
    border: 1px solid #333; display: flex; gap: 12px; align-items: center;
  }
  
  .btn {
    background: #00e5ff; color: #000; border: none; padding: 8px 16px;
    font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: #70f0ff; }
  
  file-input { display: none; }
  #status { font-size: 12px; color: #aaa; }

  /* Скрытое видео с камеры */
  #webcam { display: none; }
</style>

<!-- MediaPipe Selfie Segmentation -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="viewport">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="ui">
  <button class="btn" onclick="document.getElementById('bgLoader').click()">🖼️ Сменить фон</button>
  <input type="file" id="bgLoader" accept="image/*" style="display:none">
  <span id="status">Управление: WASD / Стрелочки</span>
</div>

<video id="webcam" autoplay playsinline muted></video>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const webcam = document.getElementById('webcam');
const bgLoader = document.getElementById('bgLoader');
const status = document.getElementById('status');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
});

// --- 1. КАРТА И ЗАДНИЙ ФОН ---
let bgImage = new Image();
// Дефолтный сетчатый фон
let hasCustomBg = false;

bgLoader.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      bgImage.src = event.target.result;
      hasCustomBg = true;
      status.textContent = "Фон успешно обновлён!";
    };
    reader.readAsDataURL(file);
  }
});

// --- 2. ИГРОК И ПЕРЕМЕЩЕНИЕ ---
const player = {
  x: W / 2,
  y: H / 2,
  radius: 45,
  speed: 4,
  vx: 0,
  vy: 0
};

const keys = {};
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);

function handleInput() {
  player.vx = 0; player.vy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) player.vy = -player.speed;
  if (keys['KeyS'] || keys['ArrowDown']) player.vy = player.speed;
  if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -player.speed;
  if (keys['KeyD'] || keys['ArrowRight']) player.vx = player.speed;

  player.x = Math.max(player.radius, Math.min(W - player.radius, player.x + player.vx));
  player.y = Math.max(player.radius, Math.min(H - player.radius, player.y + player.vy));
}

// --- 3. ВЫРЕЗАНИЕ ФОНА С КАМЕРЫ ---
const segCanvas = document.createElement('canvas');
segCanvas.width = 160; segCanvas.height = 160;
const segCtx = segCanvas.getContext('2d');

let isSegmentationReady = false;

const selfieSegmentation = new SelfieSegmentation({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
});

selfieSegmentation.setOptions({ modelSelection: 1 });

selfieSegmentation.onResults((results) => {
  segCtx.save();
  segCtx.clearRect(0, 0, 160, 160);
  
  // Рисуем маску сегментации (силуэт человека)
  segCtx.drawImage(results.segmentationMask, 0, 0, 160, 160);
  
  // Вырезаем силуэт
  segCtx.globalCompositeOperation = 'source-in';
  segCtx.drawImage(results.image, 0, 0, 160, 160);
  
  segCtx.restore();
  isSegmentationReady = true;
});

// --- 4. РЕНДЕР СЦЕНЫ ---
function drawGrid() {
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function render() {
  handleInput();

  ctx.clearRect(0, 0, W, H);

  // Отрисовка фона
  if (hasCustomBg && bgImage.complete) {
    ctx.drawImage(bgImage, 0, 0, W, H);
  } else {
    drawGrid();
  }

  // Отрисовка игрока (аватарка с камерой)
  ctx.save();
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 229, 255, 0.2)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#00e5ff';
  ctx.stroke();
  ctx.clip(); // Обрезаем по кругу

  if (isSegmentationReady) {
    // Отрисовываем очищенный силуэт персонажа
    ctx.drawImage(segCanvas, player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
  } else if (webcam.readyState >= 2) {
    // Обычное видео пока грузится сегментация
    ctx.drawImage(webcam, player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
  }

  ctx.restore();

  requestAnimationFrame(render);
}

// --- 5. ИНИЦИАЛИЗАЦИЯ ---
async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 320 }, audio: false });
    webcam.srcObject = stream;
    await webcam.play();

    async function processCamera() {
      if (webcam.readyState >= 2) {
        await selfieSegmentation.send({ image: webcam });
      }
      requestAnimationFrame(processCamera);
    }
    processCamera();
  } catch (err) {
    status.textContent = "Ошибка камеры: " + err.message;
  }
  
  render();
}

start();
</script>
</body>
</html>
