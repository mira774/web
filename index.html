<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUB // Telegram Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Telegram Dark Theme Colors */
        :root {
            --bg-main: #0e1621;
            --bg-panel: #17212b;
            --bg-msg-mine: #2b5278;
            --bg-msg-other: #182533;
            --text-main: #f5f5f5;
            --text-muted: #7f91a4;
            --accent: #5288c1;
            --accent-hover: #6098d6;
            --danger: #e66060;
            --border: #242f3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Скроллбары */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f4a5a; border-radius: 10px; }

        /* Экраны */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; animation: fadeIn 0.4s ease; }
        .screen.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ================= AUTH SCREEN ================= */
        #auth-screen { justify-content: center; align-items: center; background: #0e1621; z-index: 1000; }
        .auth-box { background: var(--bg-panel); padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .auth-box h2 { margin-bottom: 20px; color: var(--accent); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .tg-input { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 10px; outline: none; transition: 0.2s; font-size: 0.95rem; }
        .tg-input:focus { border-color: var(--accent); }
        .tg-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 10px; }
        .tg-btn:hover { background: var(--accent-hover); }
        .tg-btn:active { transform: scale(0.98); }

        /* ================= MAIN APP ================= */
        header { background: var(--bg-panel); height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .header-title { font-weight: 600; font-size: 1.1rem; display: flex; flex-direction: column; }
        .header-title span { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; }
        
        .nav-tabs { display: flex; gap: 15px; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); font-weight: 500; cursor: pointer; font-size: 0.9rem; padding: 5px 0; position: relative; }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -18px; left: 0; width: 100%; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }

        .main-content { flex: 1; overflow: hidden; position: relative; }
        .tab-content { display: none; height: 100%; width: 100%; flex-direction: column; overflow-y: auto; padding: 20px; }
        .tab-content.active { display: flex; animation: fadeIn 0.3s ease; }

        /* ================= CHAT (Telegram Style) ================= */
        #tab-chat { padding: 0; background: url('https://i.ibb.co/3s1f9b3/tg-bg.png') center/cover; } /* Темный паттерн телеги */
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .msg-row { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; animation: slideUp 0.2s ease-out forwards; }
        .msg-row.mine { align-self: flex-end; align-items: flex-end; }
        
        .msg-bubble { background: var(--bg-msg-other); padding: 10px 14px; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); position: relative; display: flex; flex-direction: column; gap: 4px; }
        .msg-row.mine .msg-bubble { background: var(--bg-msg-mine); border-radius: 16px 16px 4px 16px; }
        
        .msg-author { font-size: 0.8rem; font-weight: 600; color: var(--accent); cursor: pointer; }
        .msg-row.mine .msg-author { display: none; }
        
        .msg-text { font-size: 0.95rem; line-height: 1.4; word-break: break-word; user-select: text; }
        .msg-meta { font-size: 0.7rem; color: rgba(255,255,255,0.5); align-self: flex-end; margin-top: 2px; display: flex; gap: 4px; align-items: center; }

        .room-link { color: #38bdf8; cursor: pointer; font-weight: 500; text-decoration: underline; text-decoration-color: rgba(56,189,248,0.4); }
        .room-link:hover { color: #7dd3fc; }

        .chat-input-area { background: var(--bg-panel); padding: 12px 20px; display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid var(--border); }
        .chat-input-area textarea { flex: 1; background: var(--bg-main); border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 20px; resize: none; max-height: 120px; min-height: 44px; outline: none; font-size: 0.95rem; line-height: 1.4; }
        .btn-send { background: var(--accent); border: none; width: 44px; height: 44px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .btn-send:hover { background: var(--accent-hover); transform: scale(1.05); }

        /* ================= GAMES SECTION ================= */
        .card { background: var(--bg-panel); padding: 20px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border); }
        .bs-btn { display: inline-flex; align-items: center; justify-content: center; background: #facc15; color: #000; font-weight: 700; text-decoration: none; padding: 10px 16px; border-radius: 8px; margin-top: 10px; width: 100%; transition: 0.2s; }
        .bs-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* ================= MODALS & DEV ================= */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
        
        .dev-actions { display: flex; gap: 5px; margin-top: 5px; }
        .dev-btn { background: rgba(0,0,0,0.3); border: none; color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        .dev-btn.del { color: var(--danger); }
        .dev-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- ЭКРАН РЕГИСТРАЦИИ -->
    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2>Регистрация в HUB</h2>
            <div class="input-group">
                <label>Отображаемый ник (на сайте)</label>
                <input type="text" id="reg-sitenick" class="tg-input" placeholder="Например: Miralim">
            </div>
            <div class="input-group">
                <label>Игровой ник (Brawl Stars)</label>
                <input type="text" id="reg-gamenick" class="tg-input" placeholder="Ник в игре">
            </div>
            <div class="input-group">
                <label>Игровой Тег (Без #)</label>
                <input type="text" id="reg-tag" class="tg-input" placeholder="Например: 2Q8L9CGY">
            </div>
            <button class="tg-btn" onclick="registerUser()">Войти в систему</button>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-screen" class="screen">
        <header>
            <div class="header-title" id="room-header-title">
                Global Chat
                <span id="room-header-subtitle">Supabase Connected</span>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('chat', this)">Чат</button>
                <button class="tab-btn" onclick="switchTab('games', this)">Игры</button>
                <button class="tab-btn" onclick="switchTab('profile', this)">Профиль</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Вкладка Чата -->
            <div id="tab-chat" class="tab-content active">
                <div class="chat-messages" id="chat-container">
                    <!-- Сообщения грузятся сюда -->
                </div>
                <div class="chat-input-area">
                    <textarea id="chat-input" placeholder="Сообщение... (Напиши #имя чтобы создать ссылку на комнату)" oninput="autoResize(this)" onkeypress="handleEnter(event)"></textarea>
                    <button class="btn-send" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <!-- Вкладка Игр (Brawl Stars) -->
            <div id="tab-games" class="tab-content">
                <div class="card">
                    <h3 style="margin-bottom: 10px;">Brawl Stars Connect</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Сгенерируй прямую ссылку для добавления в друзья или в лобби по тегу.</p>
                    
                    <div class="input-group">
                        <label>Тег игрока/комнаты (Без #)</label>
                        <input type="text" id="bs-target-tag" class="tg-input" placeholder="V8Q2J...">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <a href="#" id="bs-friend-link" class="bs-btn" target="_blank" onclick="generateBSLink('friend')">Добавить в друзья</a>
                        <a href="#" id="bs-room-link" class="bs-btn" style="background: var(--accent); color: #fff;" target="_blank" onclick="generateBSLink('room')">Войти в лобби</a>
                    </div>
                </div>
            </div>

            <!-- Вкладка Профиля -->
            <div id="tab-profile" class="tab-content">
                <div class="card" style="text-align: center;">
                    <h2 id="prof-sitenick" style="margin-bottom: 5px;">-</h2>
                    <p id="prof-tag" style="color: var(--accent); font-family: monospace; margin-bottom: 15px;">-</p>
                    <button class="tg-btn" style="background: var(--bg-main); border: 1px solid var(--danger); color: var(--danger);" onclick="logout()">Выйти из аккаунта</button>
                </div>
            </div>
        </div>
    </div>

    <!-- АДМИН ПАНЕЛЬ (Скрытая) -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--danger); margin-bottom: 15px;">Admin Control Panel</h3>
            <div class="input-group">
                <label>Создать глобальное оповещение (в разработке)</label>
                <input type="text" class="tg-input" placeholder="Текст...">
            </div>
            
            <div id="dev-user-list" style="display: none; margin-top: 15px;">
                <h4 style="margin-bottom: 10px;">Список юзеров (Локальный кэш):</h4>
                <div id="users-list-container" style="background: var(--bg-main); padding: 10px; border-radius: 8px; max-height: 150px; overflow-y: auto; font-size: 0.85rem;"></div>
            </div>

            <button class="tg-btn" style="margin-top: 20px;" onclick="document.getElementById('admin-modal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <script>
        // === НАСТРОЙКИ SUPABASE ===
        const SUPABASE_URL = 'https://kbwssibbmqgboouordty.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_vQ0z4-s98JtU3nytmGiFjg_Hg0gjk98';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
        let currentUser = null;
        let activeRoom = 'global'; // global = таблица messages, остальное - локально (для примера)
        window.isDev = false; // Режим разработчика

        // === СКРЫТЫЕ КОНСОЛЬНЫЕ КОМАНДЫ (БЕЗ ПОДСКАЗОК) ===
        Object.defineProperty(window, 'web', {
            get: function() {
                document.getElementById('admin-modal').classList.add('active');
                if(window.isDev) {
                    document.getElementById('dev-user-list').style.display = 'block';
                    renderDevUserList();
                }
                return ''; // Пустая строка чтобы в консоли не было мусора
            }
        });

        Object.defineProperty(window, 'dev', {
            get: function() {
                window.isDev = true;
                alert('[SYSTEM] Developer mode ENABLED. Вы можете редактировать и мгновенно удалять сообщения.');
                loadMessages(); // Перерисовываем чат с кнопками
                return '';
            }
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        window.onload = () => {
            const saved = localStorage.getItem('hub_user_profile');
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                updateProfileUI();
                initRealtime();
                loadMessages();
            } else {
                document.getElementById('auth-screen').classList.add('active');
            }
        };

        // === РЕГИСТРАЦИЯ ===
        function registerUser() {
            const siteNick = document.getElementById('reg-sitenick').value.trim();
            const gameNick = document.getElementById('reg-gamenick').value.trim();
            const tag = document.getElementById('reg-tag').value.trim().replace('#', '');

            if (!siteNick) return alert('Введите ник на сайте!');

            currentUser = { siteNick, gameNick, tag, id: Date.now() };
            localStorage.setItem('hub_user_profile', JSON.stringify(currentUser));
            
            // Сохраняем в локальный глобальный список для Dev режима
            let allUsers = JSON.parse(localStorage.getItem('hub_all_users') || '[]');
            if(!allUsers.find(u => u.siteNick === siteNick)) {
                allUsers.push(currentUser);
                localStorage.setItem('hub_all_users', JSON.stringify(allUsers));
            }

            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
            updateProfileUI();
            initRealtime();
            loadMessages();
        }

        function logout() {
            localStorage.removeItem('hub_user_profile');
            location.reload();
        }

        function updateProfileUI() {
            document.getElementById('prof-sitenick').innerText = currentUser.siteNick;
            document.getElementById('prof-tag').innerText = currentUser.tag ? `#${currentUser.tag}` : 'Тег не привязан';
        }

        // === UI УТИЛИТЫ ===
        function switchTab(tab, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            el.classList.add('active');
            if (tab === 'chat') { setTimeout(() => scrollToBottom(), 100); }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function scrollToBottom() {
            const c = document.getElementById('chat-container');
            c.scrollTop = c.scrollHeight;
        }

        // === ЧАТ: ГЕНЕРАЦИЯ ССЫЛОК И РЕНДЕР ===
        function formatMessageText(text) {
            let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // Если находим #хэштег, превращаем в кликабельную ссылку на комнату
            safeText = safeText.replace(/#([a-zA-Z0-9_а-яА-Я]+)/gi, '<span class="room-link" onclick="joinRoom(\'$1\')">#$1</span>');
            return safeText;
        }

        function joinRoom(roomName) {
            activeRoom = roomName;
            document.getElementById('room-header-title').innerHTML = `Room: #${roomName} <span id="room-header-subtitle">Локальная комната</span>`;
            loadMessages();
        }

        function escapeHTML(str) { return str.replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        async function loadMessages() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            let messages = [];

            if (activeRoom === 'global') {
                document.getElementById('room-header-title').innerHTML = `Global Chat <span id="room-header-subtitle">Supabase Connected</span>`;
                try {
                    const { data, error } = await _supabase.from('messages').select('*').order('id', { ascending: true }).limit(100);
                    if (error) {
                        console.error(error);
                        container.innerHTML = `<div style="text-align:center; color:var(--danger); padding:20px;">Ошибка загрузки. Проверь настройки RLS в Supabase!</div>`;
                        return;
                    }
                    messages = data || [];
                } catch(e) { console.error(e); }
            } else {
                // Локальные комнаты
                messages = JSON.parse(localStorage.getItem(`hub_room_${activeRoom}`) || '[]');
            }

            messages.forEach(msg => renderMessage(msg, container));
            scrollToBottom();
        }

        function renderMessage(msg, container) {
            const isMine = msg.username === currentUser.siteNick;
            const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const div = document.createElement('div');
            div.className = `msg-row ${isMine ? 'mine' : ''}`;
            div.id = `msg-${msg.id}`;

            // DEV кнопки
            let devActions = '';
            if (window.isDev) {
                devActions = `
                <div class="dev-actions">
                    <button class="dev-btn" onclick="editMessage('${msg.id}')">✏️ Edit</button>
                    <button class="dev-btn del" onclick="deleteMessage('${msg.id}', this)">🗑️ Del</button>
                </div>`;
            }

            div.innerHTML = `
                <div class="msg-bubble">
                    <div class="msg-author">${escapeHTML(msg.username || 'Anon')}</div>
                    <div class="msg-text" id="msg-text-${msg.id}">${formatMessageText(msg.text)}</div>
                    <div class="msg-meta">${timeStr}</div>
                    ${devActions}
                </div>
            `;
            container.appendChild(div);
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto'; // Сброс высоты
            
            if (activeRoom === 'global') {
                const { error } = await _supabase.from('messages').insert([{ 
                    username: currentUser.siteNick, 
                    text: text 
                }]);
                if(error) alert('Сообщение не отправлено! Проверь, отключен ли RLS в Supabase.');
            } else {
                let msgs = JSON.parse(localStorage.getItem(`hub_room_${activeRoom}`) || '[]');
                msgs.push({ id: Date.now(), username: currentUser.siteNick, text: text, created_at: new Date().toISOString() });
                localStorage.setItem(`hub_room_${activeRoom}`, JSON.stringify(msgs));
                loadMessages();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // === REALTIME SUPABASE ===
        function initRealtime() {
            _supabase.channel('public:messages')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                    if(activeRoom === 'global') {
                        if(payload.eventType === 'INSERT') {
                            renderMessage(payload.new, document.getElementById('chat-container'));
                            scrollToBottom();
                        } else if (payload.eventType === 'DELETE') {
                            const el = document.getElementById(`msg-${payload.old.id}`);
                            if(el) el.remove();
                        } else if (payload.eventType === 'UPDATE') {
                            const txtEl = document.getElementById(`msg-text-${payload.new.id}`);
                            if(txtEl) txtEl.innerHTML = formatMessageText(payload.new.text);
                        }
                    }
                })
                .subscribe();
        }

        // === DEV ФУНКЦИИ (Мгновенное удаление и Редакт) ===
        async function deleteMessage(id, btnElement) {
            // Мгновенное удаление из интерфейса (Optimistic UI update)
            const row = btnElement.closest('.msg-row');
            if(row) row.remove();

            if (activeRoom === 'global') {
                await _supabase.from('messages').delete().eq('id', id);
            } else {
                let msgs = JSON.parse(localStorage.getItem(`hub_room_${activeRoom}`) || '[]');
                msgs = msgs.filter(m => String(m.id) !== String(id));
                localStorage.setItem(`hub_room_${activeRoom}`, JSON.stringify(msgs));
            }
        }

        async function editMessage(id) {
            const newText = prompt("Введите новый текст сообщения:");
            if(newText === null || newText.trim() === '') return;

            // Мгновенное обновление UI
            const txtEl = document.getElementById(`msg-text-${id}`);
            if(txtEl) txtEl.innerHTML = formatMessageText(newText);

            if (activeRoom === 'global') {
                await _supabase.from('messages').update({ text: newText }).eq('id', id);
            } else {
                let msgs = JSON.parse(localStorage.getItem(`hub_room_${activeRoom}`) || '[]');
                let msg = msgs.find(m => String(m.id) === String(id));
                if(msg) {
                    msg.text = newText;
                    localStorage.setItem(`hub_room_${activeRoom}`, JSON.stringify(msgs));
                }
            }
        }

        function renderDevUserList() {
            const list = document.getElementById('users-list-container');
            const users = JSON.parse(localStorage.getItem('hub_all_users') || '[]');
            if(users.length === 0) {
                list.innerHTML = 'Пока никого нет.';
                return;
            }
            list.innerHTML = users.map(u => `<div><b>${u.siteNick}</b> (BS: ${u.gameNick} | #${u.tag})</div>`).join('<hr style="border:none; border-top:1px solid #333; margin:4px 0;">');
        }

        // === BRAWL STARS LINKS ===
        function generateBSLink(type) {
            let tag = document.getElementById('bs-target-tag').value.trim().replace('#', '');
            if(!tag) {
                alert('Сначала введи тег!');
                return;
            }
            const linkBase = type === 'friend' 
                ? `https://link.brawlstars.com/invite/friend/ru?tag=${tag}`
                : `https://link.brawlstars.com/invite/gameroom/ru?tag=${tag}`;
            
            const btn = type === 'friend' ? document.getElementById('bs-friend-link') : document.getElementById('bs-room-link');
            btn.href = linkBase;
            alert(`Ссылка сгенерирована и применена к кнопке!\nТвой тег: #${tag}`);
        }
    </script>
</body>
