<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>3D PARTICLE SUIT — Нано-Костюм</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); background: #000;
  }
  #c3d {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex;
    align-items: center; justify-content: center; background: rgba(5,10,15,0.92);
    color: #00e5ff; text-align: center; font-family: system-ui, sans-serif;
  }
  .btn {
    font-size: 18px; font-weight: bold; padding: 16px 36px; border-radius: 50px;
    background: #00e5ff; color: #000; border: none; cursor: pointer;
    box-shadow: 0 0 20px #00e5ff; margin-top: 20px; transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.95); }
  
  .hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 5; background: rgba(0,0,0,0.7); color: #00e5ff; padding: 10px 20px;
    border-radius: 20px; border: 1px solid #00e5ff; font-size: 13px; text-align: center;
    pointer-events: none;
  }
</style>

<!-- Подключение Three.js и MediaPipe Pose -->
<script src="https://cdnjs.cloudflare.net/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<video id="video" playsinline muted autoplay></video>
<canvas id="c3d"></canvas>

<div id="start">
  <div>
    <h1>NANO PARTICLE SUIT 3D</h1>
    <p style="color:#aaa; margin-top:8px;">Объёмный костюм из 2500+ силовых частиц</p>
    <button class="btn" id="startBtn">ВКЛЮЧИТЬ КОСТЮМ</button>
  </div>
</div>

<div class="hint">
  ✨ Нано-частицы автоматически покрывают тело в 3D пространстве
</div>

<script>
const video = document.getElementById('video');
const canvas3D = document.getElementById('c3d');
const startBtn = document.getElementById('startBtn');
const startScreen = document.getElementById('start');

let W = window.innerWidth, H = window.innerHeight;

// --- 1. THREE.JS СЦЕНА ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// --- 2. СИСТЕМА 3D ЧАСТИЦ ---
const PARTICLE_COUNT = 2500;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
  positions[i] = 0; positions[i + 1] = 0; positions[i + 2] = 0;
  colors[i] = 0.0;
  colors[i + 1] = 0.8 + Math.random() * 0.2;
  colors[i + 2] = 1.0;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Создание текстуры светящейся точки
const particleCanvas = document.createElement('canvas');
particleCanvas.width = 16; particleCanvas.height = 16;
const pCtx = particleCanvas.getContext('2d');
const grad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.5, 'rgba(0,229,255,0.8)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
pCtx.fillStyle = grad; pCtx.fillRect(0, 0, 16, 16);

const pTexture = new THREE.CanvasTexture(particleCanvas);

const material = new THREE.PointsMaterial({
  size: 0.07,
  map: pTexture,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

// --- 3. ОБЪЕМ ВОКРУГ ТЕЛА ---
const BONES = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24],
  [23, 25], [24, 26], [25, 27], [26, 28]
];

function updateBodyParticles(landmarks) {
  const posAttr = geometry.attributes.position;
  let pIdx = 0;

  const to3D = (lm) => new THREE.Vector3(
    -(lm.x - 0.5) * 4.5,
    -(lm.y - 0.5) * 3.2,
    -lm.z * 2
  );

  BONES.forEach(([i, j]) => {
    if (!landmarks[i] || !landmarks[j]) return;
    const pA = to3D(landmarks[i]);
    const pB = to3D(landmarks[j]);

    const particlesPerBone = 180;
    const radius = 0.18;

    for (let k = 0; k < particlesPerBone; k++) {
      if (pIdx >= PARTICLE_COUNT) break;

      const t = k / particlesPerBone;
      const angle = (k * 137.5) * (Math.PI / 180) + performance.now() * 0.002;

      const cx = pA.x + (pB.x - pA.x) * t;
      const cy = pA.y + (pB.y - pA.y) * t;
      const cz = pA.z + (pB.z - pA.z) * t;

      const offsetX = Math.cos(angle) * radius;
      const offsetZ = Math.sin(angle) * radius;

      posAttr.setXYZ(pIdx, cx + offsetX, cy, cz + offsetZ);
      pIdx++;
    }
  });

  if (landmarks[0]) {
    const head = to3D(landmarks[0]);
    while (pIdx < PARTICLE_COUNT) {
      const a1 = Math.random() * Math.PI * 2;
      const a2 = Math.random() * Math.PI * 2;
      const r = 0.25;
      posAttr.setXYZ(
        pIdx,
        head.x + Math.sin(a1) * Math.cos(a2) * r,
        head.y + Math.sin(a1) * Math.sin(a2) * r,
        head.z + Math.cos(a1) * r
      );
      pIdx++;
    }
  }

  posAttr.needsUpdate = true;
}

// --- 4. MEDIAPIPE POSE ---
const pose = new Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
  modelComplexity: 0,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

pose.onResults((results) => {
  if (results.poseLandmarks) {
    updateBodyParticles(results.poseLandmarks);
  }
});

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y = Math.sin(performance.now() * 0.001) * 0.05;
  renderer.render(scene, camera);
}
animate();

// --- 5. ПРЯМОЙ ЗАПУСК КАМЕРЫ ---
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    startScreen.style.display = 'none';

    // Фоновый цикл отправки кадров
    async function processVideo() {
      if (video.readyState >= 2) {
        await pose.send({ image: video });
      }
      requestAnimationFrame(processVideo);
    }
    processVideo();

  } catch (err) {
    alert('Не удалось открыть камеру: ' + err.message);
  }
}

startBtn.addEventListener('click', startCamera);
</script>
</body>
</html>
